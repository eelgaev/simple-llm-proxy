# Example nginx vhost for putting simple-llm-proxy behind TLS.
#
# The defaults nginx ships with are wrong for an LLM endpoint in two ways: it
# buffers the whole request body before contacting the upstream, and it gives
# up on an upstream that stays quiet for 60s. Both are fixed below.
#
# Adjust server_name, the certificate paths, and the proxy_pass port to match
# your setup.

server {
    listen 443 ssl;
    server_name llm.example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;
    include /etc/nginx/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # This vhost serves a JSON API, not a browser app, so the frame and CSP
    # rules a web UI would need don't apply.
    add_header X-Content-Type-Options "nosniff";

    # Multimodal payloads arrive here. The proxy itself doesn't cap body size,
    # so whatever you set is the binding limit.
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for unbuffered request bodies below, and keeps the upstream
        # connection alive instead of reconnecting on every request.
        proxy_http_version 1.1;

        # Stream the request body upstream as it arrives. Without this nginx
        # buffers the whole body (to a temp file past client_body_buffer_size)
        # before the proxy sees a single byte, which defeats the proxy's own
        # streaming of request bodies to backends.
        proxy_request_buffering off;

        # Stream the SSE response back to the client without buffering, so
        # tokens arrive as the backend produces them.
        proxy_buffering off;

        # Time to first byte from the upstream, not total request time. A
        # request queued behind a long generation, or a cold prefill at large
        # context, blows past the 60s default and the client gets a bare 504.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 80;
    server_name llm.example.com;

    # $request_uri matters: without it an API client that hits http:// gets
    # redirected to / and loses its path.
    return 302 https://llm.example.com$request_uri;
}
